<!-- Research Comparison Table Component -->
<div class="research-comparison-table">
  <h2>{{ include.title }}</h2>
  <p class="table-subtitle">{{ include.subtitle }}</p>
  
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          {% for header in include.headers %}
            <th>{{ header }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for row in include.rows %}
          <tr>
            {% for cell in row %}
              <td>{{ cell }}</td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  
  {% if include.table_caption %}
    <div class="table-caption">{{ include.table_caption }}</div>
  {% endif %}
</div>

<style>
.research-comparison-table {
  margin: 3rem 0;
  padding: 2rem;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.research-comparison-table h2 {
  text-align: center;
  margin-bottom: 1rem;
  font-size: 1.5rem;
  font-weight: 600;
}

.table-subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 1.5rem;
}

.table-responsive {
  overflow-x: auto;
}

.research-comparison-table table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.research-comparison-table th {
  background-color: #f5f5f5;
  padding: 0.8rem 0.5rem;
  text-align: left;
  font-weight: 600;
  border: 1px solid #ddd;
}

.research-comparison-table td {
  padding: 0.8rem 0.5rem;
  border: 1px solid #ddd;
  vertical-align: top;
}

.research-comparison-table tr:nth-child(even) {
  background-color: #f9f9f9;
}

.research-comparison-table tr:hover {
  background-color: #f1f1f1;
}

.table-caption {
  margin-top: 1rem;
  text-align: center;
  font-style: italic;
  color: #666;
  font-size: 0.9rem;
}

.checkmark {
  color: #4CAF50;
  font-weight: bold;
}

.x-mark {
  color: #F44336;
  font-weight: bold;
}

@media (max-width: 768px) {
  .research-comparison-table {
    padding: 1rem;
  }
  
  .research-comparison-table table {
    font-size: 0.8rem;
  }
  
  .research-comparison-table th,
  .research-comparison-table td {
    padding: 0.5rem 0.3rem;
  }
}
</style>
